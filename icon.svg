<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Image Studio">
  <!--
    A picture in a tile: one rounded tile, one sun, one ridge. Two white shapes on
    a blue tile is what survives being drawn at 28px in the Plugins list; the
    earlier frame-plus-spark version turned to mush there.
  -->
  <defs>
    <linearGradient id="is-tile" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b9bf7" />
      <stop offset="1" stop-color="#4a5fd6" />
    </linearGradient>
    <clipPath id="is-window">
      <rect x="6" y="6" width="52" height="52" rx="14" />
    </clipPath>
  </defs>

  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#is-tile)" />

  <g clip-path="url(#is-window)">
    <circle cx="23" cy="23.5" r="5.2" fill="#ffffff" />
    <path d="M0 58 L25 28 L37 43 L44 34 L66 58 Z" fill="#ffffff" />
  </g>
</svg>
