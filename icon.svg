<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Image studio">
  <!--
    A generated picture: a bold frame, one dominant mountain with a smaller one
    beside it, a sun above the ridge, and a single spark. Flat shapes with a gap
    between the sun and the ridge, because the plugin card draws this at 28px
    where overlapping shapes turn to mud.
  -->
  <defs>
    <linearGradient id="dsh-image-studio-frame" x1="8" y1="20" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6690f2" />
      <stop offset="1" stop-color="#4157d0" />
    </linearGradient>
    <clipPath id="dsh-image-studio-window">
      <rect x="8" y="20" width="48" height="36" rx="10" />
    </clipPath>
  </defs>

  <!-- The frame -->
  <rect x="8" y="20" width="48" height="36" rx="10" fill="url(#dsh-image-studio-frame)" />

  <!-- The picture inside it -->
  <g clip-path="url(#dsh-image-studio-window)">
    <circle cx="20.5" cy="29.5" r="4.4" fill="#ffffff" fill-opacity="0.97" />
    <path d="M0 58 L31 34 L41 47 L48 39 L68 58 Z" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- The spark: one four-point star, violet so it reads as "made", not "taken" -->
  <path d="M52 2 L55 9.9 L62.9 13 L55 16.1 L52 24 L49 16.1 L41.1 13 L49 9.9 Z" fill="#8b5cf6" />
</svg>
